[project]
name = "aic"
version = "0.2.0"
description = "Incremental impact analysis: what does this change actually put at risk?"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aic = "aic.surfaces.cli:main"
aic-mcp = "aic.surfaces.mcp:main"

[project.optional-dependencies]
test = ["pytest"]
# The MCP SDK pulls 27 transitive dependencies and needs 3.10+, so it stays
# optional -- `aic` itself remains dependency-free and runs on 3.9.
#
# On v2, which tracks the 2026-07-28 stateless spec. No v1 compatibility branch:
# supporting both majors would roughly double the branches in a file written to
# be cheap to throw away, which would trade the property that made this port
# a one-file change for the ability to run against clients that have moved on.
#
# The count barely moved (28 -> 27). Import time did: 549ms -> 971ms for the
# server module, and startup is import time. See bench/SURFACES.md.
mcp = ["mcp>=2,<3; python_version>='3.10'"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aic*"]
