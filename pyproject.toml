[project]
name = "aic"
version = "0.2.0"
description = "Incremental impact analysis: what does this change actually put at risk?"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aic = "aic.surfaces.cli:main"
aic-mcp = "aic.surfaces.mcp:main"

[project.optional-dependencies]
test = ["pytest"]
# The MCP SDK pulls ~13 transitive dependencies and needs 3.10+, so it stays
# optional -- `aic` itself remains dependency-free and runs on 3.9.
# Pinned below 2.0 on purpose: SDK v2 tracks the 2026-07-28 stateless spec and
# replaces the server core. Move to it once clients negotiate that revision.
mcp = ["mcp>=1.26,<2; python_version>='3.10'"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aic*"]
